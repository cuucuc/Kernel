[package]
name = "kernel-mahel"
version = "0.1.0"
edition = "2024"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"
uart_16550 = "0.9.0"
x86_64 = "0.15"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]
uart_16550 = "0.6.0"

[[bin]]
name = "kernel-mahel"
test = false
bench = false
